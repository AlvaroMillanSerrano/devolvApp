services:
  frontend:
    build: ./devolvapp_frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
  
  backend:
    build: ./devolvapp_backend
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=devolvapp
      - POSTGRES_USER=manager
      - POSTGRES_PASSWORD=4321
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=demo
      - RABBITMQ_PASSWORD=demo
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
      - SMTP_AUTH=false
      - SMTP_STARTTLS=false
      - FRONTEND_BASE_URL=http://localhost
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -q 'app.jar' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notification:
    build: ./devolvapp_notification
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=demo
      - RABBITMQ_PASSWORD=demo
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
      - SMTP_AUTH=false
      - SMTP_STARTTLS=false
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailhog:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    container_name: devolv-postgres
    environment:
      POSTGRES_DB: devolvapp
      POSTGRES_USER: manager
      POSTGRES_PASSWORD: 4321
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manager -d devolvapp"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: devolv-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: devolv-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: demo
      RABBITMQ_DEFAULT_PASS: demo
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    restart: unless-stopped
    user: "0"
    ports:
      - "8025:8025"
    environment:
      - MH_STORAGE=maildir
      - MH_MAILDIR_PATH=/maildir
    volumes:
      - mailhog_data:/maildir

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  mailhog_data: